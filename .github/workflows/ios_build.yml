name: iOS Build (IPA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build Flutter iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Generate Podfile via Simulator Build
        run: flutter build ios --simulator --debug --no-codesign || true

      - name: Inject Permissions and Re-install Pods
        run: |
          sed -i '' 's/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target)\n      config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] ||= ["$(inherited)", "PERMISSION_CAMERA=1", "PERMISSION_MICROPHONE=1"]/g' ios/Podfile
          cd ios
          pod install

      - name: Build unsigned iOS App
        run: flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r KikiLive_iOS_Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikiLive_iOS_Unsigned.ipa
          path: build/ios/iphoneos/KikiLive_iOS_Unsigned.ipa
